name: CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
    - name: Build site
      run: npm run build
    - name: Run unit tests
      run: npm test
    - name: Run e2e tests
      run: npm run test:e2e
    - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      if: always()
      with:
        name: dist
        path: dist/
    - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      if: failure()
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 14

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    concurrency:
      group: deploy-master
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist/
    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: us-east-1
    - name: Sync to S3 (app + content assets, short revalidatable cache)
      # Filenames here are NOT content-hashed (app/*.js, app/*.css, posts/*.md,
      # images, etc.), so they must never be pinned as immutable - a stale
      # cached copy would survive past a deploy. Short max-age + must-revalidate
      # keeps CDNs (Cloudflare -> CloudFront) checking back quickly. Upgrade
      # path: content-hash the filenames, then this can go back to immutable.
      run: |
        aws s3 sync dist/ "s3://${{ secrets.AWS_S3_BUCKET }}" --delete \
          --exclude "*.html" --exclude "manifest.json" --exclude "build-info.json" \
          --cache-control "public,max-age=300,must-revalidate"
    - name: Sync to S3 (html + manifests, no cache)
      run: |
        aws s3 sync dist/ "s3://${{ secrets.AWS_S3_BUCKET }}" \
          --exclude "*" --include "*.html" --include "manifest.json" --include "build-info.json" \
          --cache-control "no-cache"
    - name: Invalidate CloudFront
      run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
    - name: Smoke check
      run: |
        DEPLOYED=$(curl -fsS https://devops.lucasluize.com/build-info.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["sha"])')
        test "$DEPLOYED" = "$GITHUB_SHA"
